# HAM10000 Stage 3 (ASISM) signal settings — the dermoscopy counterpart of stage3_asism.yaml.
#
# Separate file: stage3_asism.yaml is the CheXpert configuration and is not modified. HAM10000 code
# reads THIS file; nothing here reaches the CheXpert path.

paths:
  project_root: ${oc.env:PROJECT_ROOT,.}
  outputs_dir: ${paths.project_root}/outputs/ham10000/stage3
  # The Grad-CAM reference and the three classifier-dependent signals (uncertainty, agreement,
  # explainability) recomputed with auxiliary_classifier_v2. A separate root, so the v1 artifacts
  # under outputs_dir are never overwritten. Similarity and IQA are not recomputed there.
  aux_v2_outputs_dir: ${paths.project_root}/outputs/ham10000/stage3_aux_v2
  aux_v3_outputs_dir: ${paths.project_root}/outputs/ham10000/stage3_aux_v3

signals:
  iqa:
    # Carried over unchanged from the CheXpert values and NOT yet recalibrated. On real gen_train
    # images (first smoke run) they flagged: near-uniform 0.0%, low-contrast 3.3%, border 5.8%,
    # clipping 0.0%. Kept until a separate decision; only the blur threshold is recalibrated here.
    blank_std_threshold: 5.0
    low_contrast_std: 15.0
    # NOT READ by the HAM10000 IQA path. compute_iqa_scores measures clipping as the fraction of
    # pixels at luminance <= 1 or >= 254 and flags the image when those sum above 0.20; none of that
    # comes from this key. Kept only so the file still parses against the CheXpert schema it was
    # derived from — do not tune it expecting an effect, and do not report it as a setting.
    clipping_percentile: 0.995

    # BORDER ARTIFACT — DECIDED 2026-09-19: measured on the CONTENT box, not the canvas.
    #
    # Evidence on real gen_train (3,586 letterboxed 512 px canvases, ham-stratified-v1):
    #   * 60% of the scored border band is padding this pipeline added.
    #   * Flagged images have border mean luminance 128.3 (the pad grey) vs 141.4 unflagged, and edge
    #     content 129.9 vs 164.0: the flag fires when the image's edge brightness happens to equal
    #     the padding grey, not when the image has a border defect. Darker mel/bkl images do that
    #     more often (11.5% / 11.8% flagged vs nv 4.6%).
    #   * Visual review of flagged mel and bkl images found normal, well-textured dermoscopy.
    #   * Measured on the CONTENT box instead, the upper-2% rule flags a disjoint set (overlap 0),
    #     dominated by smooth low-texture skin — also not obviously defective.
    # DECISION AND ITS REASON. On the canvas the flag does not measure a defect in the image: it
    # measures whether the image's own edge brightness happens to match padding THIS pipeline added,
    # and it does so with a class-dependent bias against exactly the two rare classes this thesis is
    # about (mel 11.5%, bkl 11.8%, vs nv 4.6%). A 0.10 penalty inside iqa_composite — which is the
    # IQA signal's primary Go/No-Go column and a ranking-network feature — would therefore lower the
    # rank of sound mel and bkl candidates for a reason unrelated to their quality. Measured on the
    # content box the score describes the real image's own edge, which is what the flag claims.
    #
    # This is a METHODOLOGY choice, fixed before any signal artifact exists. It is NOT derived from
    # asism_tuning_heldout or final_eval_heldout: the evidence above comes from gen_train alone.
    # It must stay fixed from here on — every candidate's iqa_composite, and so Go/No-Go, the
    # ranking network and the thresholds, are computed under it. Changing it after
    # ham10000_01_compute_signals.py has run invalidates those artifacts rather than updating them.
    #
    # border_calibration stays DISABLED: enabling it would additionally replace the inherited 0.30
    # threshold with a quantile of real gen_train, which is a separate decision about the CUTOFF,
    # not about the region being measured. Left for sensitivity work.
    border_region: "content_box"       # "canvas" (inherited behaviour) | "content_box"
    border_uniform_fraction: 0.30      # inherited constant; used only while calibration is disabled
    border_calibration:
      enabled: false
      source_split: "gen_train"
      rule: "upper_quantile"           # flag only the most uniform (1 - quantile) of real gen_train
      quantile: 0.98
      region: "content_box"            # must equal border_region when enabled
      artifact_filename: "iqa_border_calibration.json"

    # DELIBERATELY NULL. The CheXpert value (40.0) flagged 31.9% of real, clinically accepted
    # gen_train images as blurry (nv 35%, df 13%): it was measuring how smooth dermoscopy naturally
    # is, not a defect. compute_iqa_scores refuses to run until this is filled from the gen_train
    # calibration artifact via resolve_iqa_config — there is no fallback constant.
    laplacian_blur_threshold: null

    blur_calibration:
      # RULE: the threshold is the `quantile` lower quantile of Laplacian-variance sharpness over
      # the PREPROCESSED gen_train images (same 512 px letterbox canvas every scored image uses).
      #
      # RATIONALE: every HAM10000 image passed clinical curation, so the gen_train distribution is
      # the reference for "acceptably sharp dermoscopy". An image is flagged only when it is blurrier
      # than all but `quantile` of those real images. By construction the rule rejects ~quantile of
      # real gen_train images, so the flag rate is a chosen, reported number instead of an accident
      # of a threshold inherited from radiographs. One POOLED threshold (not per class): synthetic
      # candidates of every class must meet the same technical bar, and per-class thresholds would
      # accept blurrier images for exactly the classes whose real images happen to be blurrier.
      # Per-class rejection rates are still reported so any class imbalance in the flag is visible.
      #
      # SOURCE: gen_train only. asism_tuning_heldout and final_eval_heldout must never inform it;
      # calibrate_blur_threshold checks image ids against both and refuses any overlap.
      source_split: "gen_train"
      rule: "lower_quantile"
      quantile: 0.02
      artifact_filename: "iqa_blur_calibration.json"

  explainability:
    border_fraction: 0.12
    mass_fraction: 0.80
    min_reference_size: 20

  # -------------------------------------------------------------------------------------------
  # Similarity — DINOv2 embeddings, k-NN against REAL gen_train images of the same class.
  #
  # Same encoder and same pinned revision as the CheXpert stage (stage3_asism.yaml): the choice is
  # not dataset-specific. DINOv2 is self-supervised on natural images with no medical labels, so it
  # carries no diagnostic prior into a realism measurement — it compares appearance, which is the
  # only thing this signal claims to compare. It is NOT fine-tuned on HAM10000: an encoder tuned on
  # the same real images would measure closeness to its own training set.
  # -------------------------------------------------------------------------------------------
  similarity:
    encoder: "vit_small_patch14_dinov2"   # architecture; the weights below are what actually load
    weights_repo_id: "timm/vit_small_patch14_dinov2.lvd142m"
    weights_filename: "model.safetensors"
    # Pinned by commit, never "main": a moved tag would silently change every embedding, and with it
    # every similarity score and every selection decision downstream.
    weights_revision: "936966a8732c5442c9def5d126f2cc4ad4243dba"
    batch_size: 32

    k_neighbors: 15                 # k-NN aggregation; never single-nearest-neighbour
    # Real references sampled per CLASS from gen_train. Flat, not proportional: nv would otherwise
    # supply two thirds of every pool, and the rare classes — the ones the synthetic data exists for
    # — would be compared against the thinnest references.
    reference_sample_per_class: 400
    # Floor on the same-class POOL. Below it the row falls back to the class-agnostic tier and says
    # so in similarity_reference_tier.
    min_same_class_references: 25

    # MEMORISATION, not fidelity. The 0.95 cutoff is literature-grounded, not hand-tuned: DINOv2
    # cosine >= 0.95 means "almost identical" for medical latent-diffusion output, validated against
    # real patient replication by Dar et al., "Unconditional latent diffusion models memorize
    # patient imaging data", Nature Biomedical Engineering (2025), doi:10.1038/s41551-025-01468-8.
    # Carried over unchanged from the CheXpert stage and NOT recalibrated on dermoscopy; the flag
    # rate on the first full candidate pool is reported so the number can be revisited on evidence.
    near_duplicate_similarity: 0.95
    # Only sharpens an already-flagged image into "collapsed onto ONE real image" vs "close to a
    # cluster of near-identical real ones". It never creates a flag on its own.
    near_duplicate_top1_gap: 0.02

  # -------------------------------------------------------------------------------------------
  # Uncertainty — MC Dropout over the frozen auxiliary classifier.
  # -------------------------------------------------------------------------------------------
  uncertainty:
    # Passes through the SAME images with different dropout masks. 20 is the usual operating point
    # in the MC-Dropout literature and the cost here is linear in this number.
    mc_dropout_passes: 20

    # Bands on NORMALISED MUTUAL INFORMATION (epistemic uncertainty / log 7), so both numbers read
    # as a fraction of the maximum possible uncertainty and do not change meaning if the class count
    # ever does.
    #
    # PROVISIONAL, and deliberately not presented as calibrated: unlike the IQA blur threshold,
    # these two do not gate anything. Nothing in the pipeline penalises a band — the column is
    # reported and the selection policy decides. The band distribution over the real gen_train
    # images is written with the signal artifact, so if the split turns out to be uninformative
    # (nearly every image in one band) it is visible before any selection is made.
    low_band_max: 0.05
    moderate_band_max: 0.20

  # -------------------------------------------------------------------------------------------
  # Agreement — the auxiliary classifier's read of the class the recipe asked the generator for.
  # -------------------------------------------------------------------------------------------
  agreement:
    # A rival class is "confident" past this. 1/7 = 0.143 is chance on this dataset, so 0.5 means a
    # rival holding at least half the probability mass — an image that reads as a different lesion,
    # not merely an unsure one.
    rival_confidence_threshold: 0.5
    # Deliberately below 1.0. Under a softmax the rival probability is not independent evidence (it
    # is already reflected in a low intended probability), so weighting it at 1.0 would count the
    # same failure twice. It separates "confidently the wrong lesion" from "diffusely unsure".
    penalty_weight: 0.5

# ---------------------------------------------------------------------------------------------
# ASISM auxiliary classifier — the real-only model this stage scores WITH, never scores.
#
# Its first role is the Grad-CAM reference: the gen_train explainability distribution is built from
# this model's attention. Reusing it later for the uncertainty and agreement signals is permitted
# only while those signals pin this SAME cam_model_id and the same reference sets; a signal that
# needs a different model needs its own identity, not a redefinition of this one.
# ---------------------------------------------------------------------------------------------
auxiliary_classifier:
  checkpoint_dir: ${paths.project_root}/checkpoints/ham10000/asism_auxiliary

  # NOT gen_train — that is the explainability REFERENCE split. A model trained on it has memorised
  # the very images whose attention would define the reference, so the reference would be its own
  # training attention. cam_model_identity refuses the combination outright; this is the
  # experimenter's chosen option 2 in docs/ham10000_gradcam_calibration.md: a dedicated model on
  # classifier_train rather than a reused condition-A run.
  train_split: "classifier_train"

  # MEASURED ON, NOT SELECTED ON. train_classifier runs a fixed optimizer-step budget and returns
  # the final model — there is no best-checkpoint selection here, exactly as in Stage 4. The split
  # is scored once after training so the manifest records what the frozen model actually does.
  selection_split: "classifier_val"

  architecture: "densenet121"
  pretrained_source: "imagenet"     # CheXpert-pretrained is rejected in build_model
  dropout_p: 0.2

  # 512 = the preprocessing canvas. DenseNet121's last dense block is then 16x16, so the letterbox
  # content box (0.125 / 0.875) falls exactly on CAM-cell boundaries — the property
  # ham10000_explainability.gradcam and content_weights both assume.
  resolution: 512

  # ONE seed, deliberately: a calibration reference must name a single model, and cam_model_id is
  # one value. Multi-seed averaging would need a different reference contract.
  seed: 42

  # Same budget shape as Stage 4 so the reference model is trained the way the experiment's models
  # are trained.
  max_steps: 3000
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

  # The reference describes where a plain model looks, not how well a tuned one scores. Reweighting
  # would change the attention this stage calls "normal".
  class_weighting: "none"

# ---------------------------------------------------------------------------------------------
# v2 auxiliary classifier — a separate model; the v1 block above is unchanged and stays the model
# every v1 artifact names.
#
# WHY v2 REWEIGHTS. The v1 model, measured once on classifier_val, recalls nv 0.94 but mel 0.34,
# akiec 0.33 and df 0.00 (balanced accuracy 0.478), and it read 65% of the synthetic pool as nv.
# Agreement, uncertainty and explainability are all computed from this one model, so a model that
# cannot recognise df makes df agreement meaningless. v2 therefore trains a class-balanced model
# with orientation flips. v1's "plain model" rationale is a v1 decision; v2 rebuilds its Grad-CAM
# reference from this model, and cam_model_identity keeps the two from being mixed.
#
# Same splits, architecture, resolution, seed and budget as v1, so the only differences are the
# weighting and the flips.
# ---------------------------------------------------------------------------------------------
auxiliary_classifier_v2:
  checkpoint_dir: ${paths.project_root}/checkpoints/ham10000/asism_auxiliary_v2
  train_split: "classifier_train"
  selection_split: "classifier_val"
  architecture: "densenet121"
  pretrained_source: "imagenet"
  dropout_p: 0.2
  resolution: 512
  seed: 42
  max_steps: 3000
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

  # Inverse class frequency on classifier_train, normalised to mean 1
  # (scripts/utils/ham10000_classifier.py: class_weights_from_records).
  class_weighting: "inverse_frequency"

  # Horizontal and vertical flips, each p = 0.5. No 90-degree rotation: it would move the letterbox
  # padding to the sides (see LesionRecordDataset).
  augmentation: "flips"

  # PRE-REGISTERED 2026-09-27, before this model was trained. Both must hold, on classifier_val,
  # measured once. If either fails, the model is not used, and neither threshold is revised after
  # the number is seen.
  acceptance:
    # The v1 auxiliary classifier's balanced accuracy on classifier_val (0.47826...), from
    # snapshot_cmp/stage2_snapshot_cmp/evaluation/classifier_val_recall.json. v2 must exceed it.
    min_balanced_accuracy_exclusive: 0.478
    # No class may have zero recall. v1 had df = 0.00, which made df agreement meaningless.
    # classifier_val holds only 15 df images, so df recall moves in steps of about 0.067.
    require_nonzero_recall_every_class: true

# ---------------------------------------------------------------------------------------------
# v3a auxiliary classifier: the v2 recipe with ONE change, the training step chosen by
# cross-validation instead of the last step. It is built only because the pre-registered v2 signal
# diagnostic returned build_v3 (docs/ham10000_v2_signal_criteria.md, "Step v3a"; the
# separability check, docs/ham10000_synthetic_separability.md, left that verdict standing).
#
# The step is chosen on classifier_train alone:
#   * 5 folds, grouped by lesion_id and stratified by dx;
#   * each fold model trains to max_steps and is scored every eval_every_steps;
#   * the step with the best balanced accuracy on the POOLED out-of-fold predictions wins, and a
#     step within tie_tolerance of it is tied, with the tie going to the lower pooled NLL;
#   * the final model trains on all of classifier_train and stops at that step, without rescaling.
# classifier_val, asism_tuning_heldout and final_eval_heldout take no part in the choice.
# classifier_val stays the acceptance split, and the acceptance criteria are v2's, unchanged.
# ---------------------------------------------------------------------------------------------
auxiliary_classifier_v3:
  checkpoint_dir: ${paths.project_root}/checkpoints/ham10000/asism_auxiliary_v3
  train_split: "classifier_train"
  selection_split: "classifier_val"
  architecture: "densenet121"
  pretrained_source: "imagenet"
  dropout_p: 0.2
  resolution: 512
  seed: 42
  max_steps: 3000
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  class_weighting: "inverse_frequency"
  augmentation: "flips"
  acceptance:
    min_balanced_accuracy_exclusive: 0.478
    require_nonzero_recall_every_class: true

  # FIXED 2026-09-27, before any v3 training.
  checkpoint_selection:
    method: "lesion_grouped_stratified_kfold"
    n_folds: 5
    fold_seed: 42
    eval_every_steps: 250
    tie_tolerance: 0.005
    tie_breaker: "pooled_oof_nll"

# ---------------------------------------------------------------------------------------------
# Stage 3b — the Go/No-Go gate's thresholds (scripts/asism/ham10000_02_gonogo.py).
#
# These decide which signals may be weighted into the selector at all, so they are set BEFORE the
# artifacts are looked at and are not adjusted to admit a signal that failed.
# ---------------------------------------------------------------------------------------------
gonogo:
  # A score taking fewer distinct values than this cannot order a candidate pool of thousands: it is
  # a coarse flag, not a ranking feature. Well below any real signal's resolution, so it fires only
  # on a genuinely degenerate artifact.
  min_unique_values: 20

  # Unscorable candidates. Explainability's NaNs for a class whose gen_train reference was too thin
  # count here: legitimate and recorded, but still candidates this signal cannot rank, and a signal
  # missing for a whole class would silently select only within the classes it covers.
  max_missing_fraction: 0.05

  # Rank correlation, within class, class-size weighted. 0.90 is deliberately permissive: signals
  # measuring related properties of the same image SHOULD correlate, and the gate is looking for a
  # near-restatement — one signal's ranking recoverable from another's — not for mere association.
  redundancy_abs_correlation_max: 0.90
  # Classes with fewer comparable pairs than this are skipped rather than contributing a correlation
  # estimated from a handful of candidates.
  min_pairs_for_correlation: 20

  # Usefulness: the equal-weight reference selector keeps this fraction OF EACH CLASS, with and
  # without the signal under test. Half is the neutral choice — it maximises the number of candidates
  # whose inclusion could change — and it is a diagnostic here, not the selection rate Stage 3 will
  # actually use; that rate is what Adaptive Threshold Learning decides.
  selection_fraction: 0.5
  # Overlap at or above this means the signal moved essentially nothing.
  usefulness_jaccard_max: 0.99

# ---------------------------------------------------------------------------------------------
# Learned selection — the Multi-Objective Ranking Network (ham10000_03/04) and, downstream of it,
# Adaptive Threshold Learning. This is the thesis's proposed method; the weighted composite remains
# as the baseline it is compared against, and neither replaces the other.
# ---------------------------------------------------------------------------------------------
learned_asism:
  enabled: true
  seed: 42
  checkpoint_dir: ${paths.project_root}/checkpoints/ham10000/asism_learned

  # BALANCED ACCURACY, not accuracy. Plain accuracy on a two-thirds-nv, seven-class problem is
  # maximised by a model that never predicts a rare class — the exact failure the synthetic data
  # exists to fix, so a subset that helps df and akiec would be scored as useless. Balanced accuracy
  # averages recall over the seven classes, so every class counts the same regardless of how many
  # images it has. macro_f1 is the supported alternative; whichever is chosen is recorded in every
  # artifact, because a utility measured under one and compared under the other is not a comparison.
  utility_metric: "balanced_accuracy"

  # The real component of every proxy training run. NOT gen_train (the generator's own training
  # images) and never final_eval_heldout.
  real_train_split: "classifier_train"

  # The columns the learned models may see, in this order. Each must have a registered owner in
  # ham10000_ranking.FEATURE_COLUMNS_BY_SIGNAL, and a column whose signal did not survive Go/No-Go is
  # dropped before training — implementation is not admission, and that rule binds the learned
  # selector exactly as it binds the weighted one.
  feature_columns:
    - similarity_knn_mean
    - similarity_top1
    - similarity_topk_spread
    - iqa_composite
    - iqa_sharpness
    - iqa_contrast_std
    - uncertainty_mutual_information
    - uncertainty_predictive_entropy
    - explainability_calibrated_typicality
    - agreement_score
    - agreement_margin

  # Technical safety, applied to the candidate pool BEFORE anything is learned from it, and read
  # from the iqa/similarity artifacts directly whatever the Go/No-Go gate decided about those
  # signals. A memorised near-copy of a real patient's lesion must not become selectable because the
  # similarity signal happened to be redundant with another one.
  safety:
    reject_invalid_iqa: true
    reject_near_duplicates: true

  subset_design:
    # Kept small relative to the candidate pool so that a single-signal subset — which draws
    # entirely from ONE quantile band of ONE feature, within ONE role pool — is still drawable
    # without replacement. --phase feasibility computes exactly that against the real pool and
    # refuses the build if it does not hold.
    subset_sizes: [60, 120, 180]
    total_subsets: 80
    random_fraction: 0.20
    single_signal_fraction: 0.30
    mixed_fraction: 0.50
    quantile_bins: 3
    # An image measured in fewer subsets than this gets no distilled target: a marginal contribution
    # averaged over one or two subsets is noise. Reported at build time, enforced at training time.
    minimum_image_exposures: 3
    val_pool_fraction: 0.20
    seed: 42
    # --phase build refuses unless the newest feasibility report matches this config and shows zero
    # failures. No size or ratio is ever adjusted automatically to make a failing report pass.
    feasibility_thresholds:
      min_candidates_per_class: 20
      min_candidates_per_quantile_band: 20
      min_val_subsets: 8

  # The proxy classifier whose balanced accuracy IS the measured utility. Deliberately cheaper than
  # the Stage 4 protocol — 224 px and 300 steps against Stage 4's 512 px and 3000 — because it is
  # run once per subset and its job is to RANK subsets, not to estimate the final numbers. Every
  # subset is measured under identical settings and one fixed step budget, so the comparison between
  # them is fair even though none of them is a Stage 4 run. Nothing measured here is ever reported
  # as a result.
  proxy:
    resolution: 224
    max_steps: 300
    batch_size: 32
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4
    dropout_p: 0.2
    pretrained_source: "imagenet"
    seed: 42

  set_utility_network:
    image_hidden_dims: [128, 64]
    utility_hidden_dims: [32]
    epochs: 100
    batch_size: 8
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    utility_mse_weight: 1.0
    pairwise_ranking_weight: 0.5
    early_stopping_patience: 12

  ranking_network:
    hidden_dims: [128, 64, 32]
    dropout: 0.20
    epochs: 100
    batch_size: 128
    learning_rate: 1.0e-4
    # ONE target, TWO loss terms over it: Smooth-L1 for the value and this pairwise term for the
    # order. Not a second objective — both terms score the same distilled quantity.
    pairwise_ranking_weight: 0.5
    # A single noisy proxy measurement can produce an outlier marginal value that dominates the
    # regression term. Standardising bounds its influence; the transform is order-preserving, so the
    # pairwise term is untouched.
    target_normalization: "standardize"   # "standardize" | "rank" | "none"
    target_winsorize_quantile: 0.0
    # Below this many distilled targets the ranker is fitting noise, and it refuses rather than
    # producing a model whose scores would look ordinary.
    min_training_images: 50

# ---------------------------------------------------------------------------------------------
# Stage 3e — Adaptive Threshold Learning, and the selection it publishes as asism_selected.csv.
#
# THE ORDER IS PART OF THE METHOD and is fixed in code: safety, then an absolute quality floor,
# then the class-aware threshold, then a rare class's floor, then the budget cap. Rarity never
# buys admission for a bad image, and the floor can only ever admit a class's BEST remaining
# candidates because it runs after the quality floor has removed the pool's worst.
# ---------------------------------------------------------------------------------------------
selection:
  # PRE-REGISTERED, and set before any threshold was seen. Both policies are computed on every run
  # and both appear in the manifest; this decides which one writes the selection. Which produces
  # better classifiers is a Stage 4 question — run condition C under each — not something the
  # selector can answer about itself.
  #   network     the proposed method: AdaptiveThresholdNetwork distilled from the frozen search
  #   percentile  the training-free class-adaptive baseline it has to beat
  threshold_policy: "network"

  # Absolute floor on the pooled ranking score, applied before any class is considered. Pooled, not
  # per class: a per-class floor would define "bad" relative to each class's own candidates, so the
  # weakest class's mediocre images would clear a floor its own mediocrity had set.
  quality_floor_percentile: 25

  # Budget, proportional to each class's REAL training count rather than flat. A flat quota would
  # hand df as many synthetic images as nv and change the class balance far more than the
  # augmentation intends.
  target_synthetic_to_real_ratio: 1.0
  # The floor exists so a rare class is never selected down to nothing; the cap stops a class whose
  # candidates all score well from dominating the augmented training set.
  min_accepted_per_class: 50
  max_accepted_per_class: 2000

  percentile_policy:
    # The most common class is cut at base_percentile, the rarest at min_percentile, and the classes
    # between them interpolate on RANGE-normalised prevalence.
    #
    # HONEST NOTE ON WHAT THIS NORMALISATION BUYS: very little, and the write-up must not claim
    # otherwise. Range normalisation and dividing by the maximum were measured on HAM10000's real
    # class distribution and differ by at most 0.7 percentile points for every class, because nv is
    # such an outlier that subtracting the minimum prevalence changes almost nothing. Under either
    # rule the effective behaviour is "nv at 50, every other class between 10 and 16" — six of seven
    # classes sit near the lenient end. That is a defensible policy for this dataset, and it is the
    # BASELINE the network policy is compared against, but it should be described as what it is
    # rather than as a fix for bunching.
    base_percentile: 50.0
    min_percentile: 10.0

  network_policy:
    # Weight on missing a class's budget, relative to the mean score of what is kept. At 1.0 a cut
    # that misses the budget by 100% is penalised as much as the entire available score range, so
    # the budget matters without being able to force in bad candidates on its own.
    budget_weight: 1.0
    epochs: 400
    learning_rate: 1.0e-2

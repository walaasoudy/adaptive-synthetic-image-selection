# HAM10000 ASISM v2 — the learned ranker: utility measurement, fit, stopping and acceptance.
#
# Pre-registration. Approved by Walaa on 2026-10-03 (docs/asism_v2_quantity_design_check_2026-10-03.md
# §7 and §8), before any real utility measurement exists. Nothing below may change after a
# measurement has been read. scripts/asism_v2/prereg.py refuses a value that differs from the frozen
# copy in that module, so the configuration cannot drift through this file alone.
#
# No count, ratio or K appears here: how many images are selected is an output of the stopping rule.

paths:
  project_root: ${oc.env:PROJECT_ROOT,.}
  outputs_dir: ${paths.project_root}/outputs/ham10000/stage3_asism_v2_ranker

split_namespace: "ham-stratified-v1"
real_train_split: "classifier_train"
utility_split: "asism_tuning_heldout"        # never classifier_val, never final_eval_heldout

signals: ["similarity_knn_mean", "iqa_composite", "uncertainty_mutual_information",
          "explainability_calibrated_typicality"]

safety:
  reject_invalid_iqa: true
  reject_near_duplicates: true

# ---- §8: what is measured --------------------------------------------------------------------------
supervision:
  metric: "macro_auroc_ovr"                  # absolute, no baseline subtraction
  proxy:                                     # the 224 px / 300 step recipe (re-use reason: §8)
    resolution: 224
    max_steps: 300
  role_seed: 42
  role_fractions: {train: 0.6, validation: 0.2, test: 0.2}   # per class, one role per image
  sizes: {train: [125, 250, 500, 1000], validation: [125, 250, 500], test: [125, 250, 500]}
  subsets: {train: 120, validation: 40, test: 40}
  design_seed: 42
  # Class fractions of a subset: Dirichlet(concentration * pool proportions), then capped by what the
  # role holds of each class. 20 keeps every subset near the pool mix while still varying it.
  class_fraction_concentration: 20
  tilted_fraction: 0.5                       # half random within class, half tilted on one signal
  training_seeds: [42, 43, 44, 45, 46]       # 5 repeats per subset

# ---- gate G1: before any fit -----------------------------------------------------------------------
reliability:
  min_reliability_of_subset_means: 0.80      # on train + validation subsets; test stays unread

# ---- §7: the fit and the stopping rule -------------------------------------------------------------
fit:
  seed: 42
  bootstrap_models: 200
  initial_lam: 0.02
  optimizer: "adam"
  learning_rate: 0.03
  # Amendment 2026-10-03 (before any measurement): the four values below. Before: weight decay
  # 1.0e-5, 600 epochs, patience 60, targets in the metric's own units.
  weight_decay: 0.0
  max_epochs: 5000                           # a limit the fit should not reach; reaching it is recorded
  patience: 200
  standardised_fit: true                     # fit on (target - train mean) / train SD, size term centred

stopping:
  lower_bound_quantile: 0.05                 # contract §10, one-sided 95%
  minimum_gain: null                         # none: no "enough benefit" threshold is introduced
  offer_order: "lower_bound"                 # amendment 2026-10-03: a class offers its images by their own lower bound
  stability_fit_seeds: [42, 43, 44, 45, 46]  # the selection is repeated at each; counts are reported

# ---- ranker acceptance: the test subsets, read once ------------------------------------------------
acceptance:
  min_within_size_spearman: 0.50
  max_one_sided_p: 0.05
  permutations: 10000
  permutation_seed: 42
  must_beat: "size_and_class_only"           # lower test error than the model with no signals
  reported_baselines: ["similarity_only", "equal_weight_composite"]
